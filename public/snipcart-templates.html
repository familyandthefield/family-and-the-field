<!DOCTYPE html>
<html lang="en-GB">
  <head>
    <meta charset="utf-8" />
    <title>Checkout fields</title>
  </head>
  <body>
    <div id="snipcart-templates">
      <billing section="bottom">
        <fieldset class="snipcart-form__set">
          <legend class="snipcart__font--tiny">Collection or home delivery</legend>
          <div class="snipcart-form__field">
            <snipcart-radio name="collection-or-delivery" value="Collect from Noa Bakehouse, Douglas (free)">
              Collect from Noa Bakehouse, Douglas (free)
            </snipcart-radio>
            <snipcart-radio name="collection-or-delivery" value="Home delivery">
              Home delivery
            </snipcart-radio>
            <p class="snipcart__font--tiny fulfilment-rules" id="fulfilment-rules">
              Pickup is free at Noa Bakehouse. Home delivery is available on orders over £20 (two working days’ lead time, 12:00–19:00 window).
            </p>
            <p class="snipcart__font--tiny fulfilment-warning" data-fulfilment-warning hidden></p>
            <input
              data-fulfilment-gate
              aria-hidden="true"
              tabindex="-1"
              autocomplete="off"
              style="position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0;"
            />
          </div>
        </fieldset>
      </billing>
    </div>
  </body>
</html>
